app:
  title: "SpeakType"
  idle_icon: "🎙️"
  recording_icon: "⏺️"
  processing_icon: "⏳"
  menu: ["Start Recording", "Stop Recording", "Copy Last"]

whisper:
  model: base
  language: en
  device: cpu

ollama:
  host: "http://localhost:11434"
  model: "llama3.2:latest"
  prompt_template: |
    You are a transcription editor. Lightly clean up the following transcribed speech by:
    - Fixing obvious spelling mistakes
    - Correcting grammar errors
    - Adding missing punctuation and capitalization

    Strict rules:
    - Keep the original wording and sentence structure as close as possible
    - Do NOT rephrase, reword, restructure, or summarise
    - Do NOT add, remove, or infer words that were not in the original
    - If a sentence is unclear or fragmented, leave it as-is rather than guessing intent
    - Output only the corrected text with no explanation

    Original text: {text}

    Improved text:

audio:
  sample_rate: 16000
  channels: 1
  silence_threshold: 0.01
  silence_duration: 2.0
  chunk_size: 1024
  language: "english"

clipboard:
  show_notifications: true
  notification_title: "SpeakType"
